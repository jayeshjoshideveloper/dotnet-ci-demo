name: .NET CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DotnetCiDemo.slnx

      - name: Build solution
        run: dotnet build DotnetCiDemo.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test DotnetCiDemo.slnx --configuration Release --no-build